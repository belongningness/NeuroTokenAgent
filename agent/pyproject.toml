[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurotoken-agent"
version = "0.1.0"
description = "LangGraph Agent Server for the NeuroToken pipeline"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2",
  "langchain>=1.3",
  "langchain-openai>=1.3",
  "pydantic>=2.11,<3",
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "h5py",
  "webdataset",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
server = ["langgraph-cli[inmem]>=0.4"]
test = ["pytest>=8.1", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["agent_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
