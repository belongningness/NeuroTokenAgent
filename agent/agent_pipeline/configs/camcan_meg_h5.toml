# Example config for CamCAN-like MEG H5 files.
# Relative paths are resolved from this file's directory.

[dataset]
name = "CamCAN_MEG"
modality = "meg"
task_type = "MEG"
description = "CamCAN MEG sessions stored as intermediate HDF5 files."

[paths]
h5_root = "../../data/camcan/h5"
tar_root = "../../outputs/camcan_meg_tar"
token_root = "../../outputs/camcan_meg_neurotoken"
report_root = "../../outputs/camcan_meg_reports"

[source]
adapter = "meg_h5"

[source_h5]
signal_key = "meg"
timestamps_key = "meg_timestamps"
metadata_key = "metadata_json_u8"
channels_key = "meg_channels_pkl_u8"
events_key = "events_pkl_u8"

[chunking]
strategy = "rest"
split_points = 30000
downsample_factor = 8

[tokenizer]
project_root = "../../external/unitok"
checkpoint_root = "../../checkpoints/tok-0507-16-rope-ft"
checkpoint_path = ""
train_config = "../../external/unitok/hdata/configs/tok_human.yaml"
use_ema = true
storage_dtype = "fp16"
data_seed = 42
max_chunk_batch_size = 8

[runtime]
device = "auto"
use_bfloat16 = false

[release]
dataset_name = "CamCAN_MEG"
description = "CamCAN MEG sessions stored as intermediate HDF5 files."
tokenizer_version = "tok-0507-16-rope-ft/0030000_final"

[validation]
check_event_duration_semantics = false

[reconstruction]
max_sessions = 1
max_samples = 30
max_chunk_batch_size = 8
min_mean_pearson = 0.0
